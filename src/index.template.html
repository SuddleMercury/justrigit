<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JustRigIt — Rig, animate and export characters for game engines</title>
<meta name="description" content="Guided, beginner-friendly tool that checks, fixes and exports 3D characters and animations for Unreal, Unity, Godot and Blender. Fully operable by AI agents via window.justrigit and WebMCP.">
<meta name="ai-agent-api" content="window.justrigit — call await window.justrigit.call('get_status'); see #justrigit-ai-manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1015; --panel:#161920; --panel2:#1c2029; --line:#272c37; --text:#e8eaef; --muted:#8b92a3;
  --accent:#ff7a1a; --accent2:#ffb067; --ok:#3ecf8e; --info:#5aa9ff; --warn:#ffc83d; --error:#ff5d5d;
  --r:12px; --font:'Inter',system-ui,-apple-system,Segoe UI,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:12px;background:#0b0d11;border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--accent2)}
.app{display:grid;grid-template-columns:230px 1fr 420px;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151821,#12141a)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;font-size:16px}
.logo .mark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,var(--accent),#ff4d1a,var(--accent2),var(--accent));display:grid;place-items:center;color:#1a0d02;font-size:15px;font-weight:800;box-shadow:0 0 18px #ff7a1a55}
.logo small{font-weight:500;color:var(--muted);font-size:11px;margin-left:2px}
header .sp{flex:1}
.hbtn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:500;display:flex;gap:7px;align-items:center}
.hbtn:hover{border-color:#3a4150}
.hbtn.ai{border-color:#ff7a1a66;background:#ff7a1a14;color:var(--accent2)}
nav#stepper{padding:14px 10px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:11px;padding:10px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;width:100%}
.step:hover:not(:disabled){background:var(--panel2)}
.step:disabled{opacity:.38;cursor:not-allowed}
.step .num{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;border:1.5px solid #3a4150;color:var(--muted)}
.step.done .num{background:#3ecf8e1f;border-color:var(--ok);color:var(--ok)}
.step.active{background:var(--panel2);border-color:var(--line)}
.step.active .num{background:var(--accent);border-color:var(--accent);color:#1a0d02}
.step .txt{display:flex;flex-direction:column;flex:1;line-height:1.25}
.step small{color:var(--muted);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid}
.pill.ok{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e12}
.pill.info{color:var(--info);border-color:#5aa9ff55;background:#5aa9ff12}
.pill.warn{color:var(--warn);border-color:#ffc83d55;background:#ffc83d12}
.pill.error{color:var(--error);border-color:#ff5d5d55;background:#ff5d5d12}
main{position:relative;overflow:hidden;min-width:0}
#viewport{position:absolute;inset:0}
#viewport canvas{display:block;outline:none}
#hud{position:absolute;left:14px;top:12px;background:#0e1015cc;backdrop-filter:blur(6px);border:1px solid var(--line);padding:6px 11px;border-radius:9px;font-size:12.5px;color:var(--muted)}
#hud b{color:var(--text)}
.vtools{position:absolute;right:14px;top:12px;display:flex;gap:6px}
.vtools button{background:#0e1015cc;backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px}
.vtools button.on{border-color:var(--accent);color:var(--accent2)}
.legend{position:absolute;left:14px;bottom:62px;font-size:11.5px;color:var(--muted);background:#0e1015aa;padding:4px 9px;border-radius:7px}
.legend i{display:inline-block;width:10px;height:3px;background:var(--accent);vertical-align:middle;margin-right:5px;border-radius:2px}
#timeline{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:10px;background:#0e1015d9;backdrop-filter:blur(6px);border:1px solid var(--line);padding:7px 12px;border-radius:11px}
#timeline[hidden]{display:none}
#timeline button{background:var(--accent);color:#1a0d02;border:0;border-radius:7px;width:30px;height:26px;font-weight:700;font-size:11px}
#tl-bar{flex:1;accent-color:var(--accent)}
#tl-name{font-weight:600;font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tl-time{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:54px;text-align:right}
aside{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
#panel{flex:1;overflow:auto;padding:20px 20px 30px}
#panel h2{font-size:18px;margin:0 0 6px;letter-spacing:-.2px}
.lead{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)} .small{font-size:12px}
.term{border-bottom:1.5px dotted var(--accent2);cursor:help;color:var(--accent2);white-space:nowrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:#3d4453}
.btn.primary{background:linear-gradient(180deg,#ff8a2e,#f26a0c);border-color:#ff9a4a;color:#1d0e02;box-shadow:0 4px 18px #ff7a1a33}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-style:dashed}
.btn.small{padding:5px 11px;font-size:12.5px;margin-top:8px}
.btn.wide{width:100%;margin:8px 0}
.btn.big{padding:13px;font-size:15px}
.btn:disabled{opacity:.6;cursor:wait}
.nav{display:flex;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed #3a4150;border-radius:14px;padding:28px 16px;cursor:pointer;text-align:center;background:#0e101566;transition:.15s}
.drop:hover,body.dragging .drop{border-color:var(--accent);background:#ff7a1a0d}
.drop-icon{font-size:26px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);margin-bottom:6px;color:var(--accent2)}
.drop small{color:var(--muted);margin-top:4px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin:12px 0}
.card.loaded .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.card dt{color:var(--muted)} .card dd{margin:0}
.card.soon{border-style:dashed;background:transparent}
.card.soon p{color:var(--muted);margin:4px 0 0}
.card.ok{border-color:#3ecf8e55;background:#3ecf8e0f}
.card.warnbox{border-color:#ffc83d55;background:#ffc83d0d}
.card.warnbox a{color:var(--warn)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#0e1015;border:1px solid var(--line);color:var(--muted);font-weight:500}
.help{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:#0e101555}
.help summary{cursor:pointer;font-weight:600}
.help ul{padding-left:18px;margin:8px 0}
.engines{display:flex;flex-direction:column;gap:8px}
.engine{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.engine small{color:var(--muted)}
.engine:hover{border-color:#3d4453}
.engine.sel{border-color:var(--accent);background:#ff7a1a10;box-shadow:0 0 0 3px #ff7a1a1a}
.summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.allgood{margin:10px 0;padding:11px;border-radius:10px;text-align:center;font-weight:600;color:var(--ok);background:#3ecf8e12;border:1px solid #3ecf8e44}
.issues{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.issue{display:flex;gap:11px;padding:11px 12px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line)}
.issue .ico{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.issue p{margin:3px 0 0;color:var(--muted);font-size:13px}
.issue.ok .ico{background:#3ecf8e22;color:var(--ok)}
.issue.info .ico{background:#5aa9ff22;color:var(--info)}
.issue.warn{border-color:#ffc83d44}.issue.warn .ico{background:#ffc83d26;color:var(--warn)}
.issue.error{border-color:#ff5d5d55}.issue.error .ico{background:#ff5d5d26;color:var(--error)}
table.bones{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
table.bones td,table.bones th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.seg button{text-align:left;background:#0e1015;border:1.5px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:12px;line-height:1.4}
.seg button em{color:var(--accent2);font-style:normal}
.seg button.on{border-color:var(--accent);background:#ff7a1a10}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
.capstat{display:block;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#0e1015;margin-bottom:10px;font-size:13px;line-height:1.5}
.capdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:4px;vertical-align:middle}
.capdot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .capdot.off{background:var(--error)} .capdot.demo{background:var(--warn)}
.capopts{margin:10px 0}.capopts .lbl{font-weight:600;font-size:12.5px;margin-bottom:-4px}
.capopts .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.capopts .field input,.capopts .field select{width:100%;box-sizing:border-box;min-width:0}
.lib a,.capstat a{color:var(--accent2)}
.field select{background:#0e1015;border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text);font:500 13.5px var(--font)}
.field.small{font-size:12px}.field.small input{padding:7px 9px;font-size:13px}
.clips{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.clips li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.clips li.playing{border-color:var(--accent)}
.clips li.excluded{opacity:.45}
.clips .play{width:30px;height:30px;flex:none;border-radius:8px;border:0;background:#0e1015;color:var(--accent2);font-size:12px}
.clips li.playing .play{background:var(--accent);color:#1a0d02}
.cname{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;color:var(--text);font:500 13px var(--font)}
.cname:hover,.cname:focus{border-color:var(--line);background:#0e1015;outline:none}
.dur{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.clips select{background:#0e1015;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:3px 4px;font-size:12px}
.moves{font-size:11px;color:var(--accent2);white-space:nowrap}
.still{font-size:11px;color:var(--muted);white-space:nowrap}
.inc input{accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;font-weight:600;margin-bottom:6px}
.field input{background:#0e1015;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font:500 14px var(--mono)}
.files ul{padding-left:16px;margin:8px 0}
.files li.sub{list-style:circle;margin-left:14px;font-size:12px}
.check{display:block;font-size:13px;margin-top:6px}
.check input{accent-color:var(--accent)}
.guide-head{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.md{font-size:13px;background:#0e101577;border:1px solid var(--line);border-radius:var(--r);padding:4px 14px 10px;margin-top:8px}
.md h2{font-size:15px;margin:14px 0 6px}.md h3{font-size:14px;margin:14px 0 6px;color:var(--accent2)}
.md table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
.md td,.md th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.md th{background:var(--panel2)}
.md blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid var(--accent);background:#ff7a1a0a;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.md ul,.md ol{padding-left:20px}
#log{border-top:1px solid var(--line);background:#12141a;max-height:38px;transition:max-height .2s;overflow:hidden;flex:none}
#log.open{max-height:240px}
#log .lh{display:flex;align-items:center;gap:8px;padding:9px 16px;width:100%;background:none;border:0;font-weight:600;font-size:12.5px;color:var(--muted)}
#log .lh span.c{background:var(--panel2);border-radius:99px;padding:0 7px;font-size:11px}
#log-list{list-style:none;margin:0;padding:0 14px 12px;max-height:196px;overflow:auto;font-size:12px}
#log-list li{padding:4px 0;border-bottom:1px solid #1e222b;display:flex;gap:7px;align-items:baseline}
#log-list li.err span:last-child{color:var(--error)}
.who{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;flex:none}
.who.you{background:#5aa9ff22;color:var(--info)} .who.ai{background:#ff7a1a26;color:var(--accent2)} .who.recipe{background:#3ecf8e22;color:var(--ok)}
.tip{position:fixed;z-index:50;background:#1f2430;border:1px solid #3a4150;border-radius:11px;padding:11px 13px;font-size:12.5px;box-shadow:0 12px 34px #0009;pointer-events:none}
.tip b{color:var(--accent2)} .tip p{margin:5px 0 0;color:#c9cdd6} .tip em{color:var(--text);font-style:normal;font-weight:600}
#modal{position:fixed;inset:0;background:#05060899;backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;padding:20px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(720px,100%);max-height:88vh;overflow:auto;padding:22px 24px;position:relative}
.mbox .x{position:absolute;right:14px;top:12px;background:none;border:0;font-size:20px;color:var(--muted)}
.ai-status{display:flex;flex-direction:column;gap:8px;margin:12px 0 18px}
.ai-status div{display:flex;gap:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.ai-status b{flex:none;width:130px}
.ai-status .ok b{color:var(--ok)} .ai-status .pending b{color:var(--muted)}
.ai-status span{color:var(--muted);font-size:13px}
pre.prompt{white-space:pre-wrap;font:12px/1.55 var(--mono);background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:12px;color:#c9cdd6}
.tools{list-style:none;padding:0}.tools li{padding:6px 0;border-bottom:1px solid var(--line)}.tools p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.gloss{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gloss .g{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gloss .g b{color:var(--accent2)}.gloss p{margin:4px 0 0;font-size:12.5px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
.toast{background:#1f2430;border:1px solid #3a4150;border-left:3px solid var(--ok);padding:9px 14px;border-radius:9px;box-shadow:0 10px 30px #0008;font-size:13px;max-width:560px;transition:opacity .4s}
.toast.warn{border-left-color:var(--warn)} .toast.error{border-left-color:var(--error)} .toast.out{opacity:0}
#busy{position:fixed;inset:0;display:grid;place-items:center;background:#05060877;z-index:45;font-weight:600}
#busy[hidden]{display:none}
#markers{position:absolute;inset:0;pointer-events:none}
#markers svg{position:absolute;inset:0;width:100%;height:100%}
#markers line{stroke:#ffffff55;stroke-width:1.5;stroke-dasharray:4 4}
.mk{position:absolute;left:0;top:0;width:0;height:0;pointer-events:auto;cursor:grab;touch-action:none}
.mk::before{content:'';position:absolute;left:-11px;top:-11px;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;background:var(--mc);box-shadow:0 0 0 3px #0007,0 0 14px var(--mc)}
.mk::after{content:'';position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#fff}
.mk span{position:absolute;left:14px;top:-9px;white-space:nowrap;font-size:11px;font-weight:700;background:#0e1015d9;border:1px solid var(--mc);color:#fff;padding:1px 6px;border-radius:6px}
.mk.drag{cursor:grabbing}.mk.drag::before{transform:scale(1.25)}
.mk.C,.mdot.C{--mc:#ff7a1a}.mk.L,.mdot.L{--mc:#4ea1ff}.mk.R,.mdot.R{--mc:#3ecf8e}
.mdot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--mc);flex:none;margin-top:4px}
.markers-list{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.markers-list li{display:grid;grid-template-columns:auto 1fr;column-gap:7px;font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.markers-list small{grid-column:2;color:var(--muted);font-size:11.5px;line-height:1.3}
.row3{display:flex;gap:6px}.row3 .btn{flex:1;margin:0}
body.rigging .legend{display:none}
h3.sub{font-size:14px;margin:18px 0 4px;display:flex;align-items:center;gap:8px}
.lib .tabs{display:flex;gap:4px;background:#0e1015;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.lib .tabs button{flex:1;background:none;border:0;border-radius:7px;padding:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.lib .tabs button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.pack{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.pack:first-child{border-top:0}.pack p{margin:2px 0 0;color:var(--muted);font-size:12px}.pack .btn{margin:0;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chips button{background:#0e1015;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px}
.chips button.on{border-color:var(--accent);color:var(--accent2)}
.libl{list-style:none;padding:0;margin:0;max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.libl li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;background:#0e101577;border:1px solid transparent}
.libl li.playing{border-color:var(--accent)}
.libl .play,.clips .play{width:30px;height:30px;flex:none;border-radius:8px;border:0;background:#0e1015;color:var(--accent2);font-size:12px}
.libl li.playing .play{background:var(--accent);color:#1a0d02}
.libl .ln{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.libl .ln small{color:var(--muted);font-size:11.5px}
.libl .btn{margin:0;flex:none}.added{color:var(--ok);font-weight:700;padding:0 8px}
.clips .x{background:none;border:0;color:var(--muted);font-size:17px;padding:0 4px}.clips .x:hover{color:var(--error)}
.drop.small{padding:16px 12px}
#busy .bbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;min-width:300px;text-align:center;box-shadow:0 20px 50px #000a}
#busy .bar{height:6px;border-radius:9px;background:#0e1015;margin-top:12px;overflow:hidden}
#busy .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
@media (max-width:1100px){.app{grid-template-columns:64px 1fr 380px}.step .txt,.step .pill{display:none}.step{justify-content:center}}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:56px 46vh auto 1fr;height:auto;min-height:100vh}
  nav#stepper{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px;overflow-x:auto}
  main{height:46vh}.gloss{grid-template-columns:1fr} header .label{display:none}}

/* ---- mode switch + capture wizard ---- */
.modes{display:flex;gap:4px;background:#0e1015;border:1px solid var(--line);border-radius:11px;padding:3px;margin-left:18px}
.modes button{background:none;border:0;border-radius:8px;padding:6px 12px;color:var(--muted);font-weight:600}
.modes button small{font-weight:500;font-size:10.5px;opacity:.75}
.modes button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
body.mode-capture .app{grid-template-columns:0 1fr 470px}
body.mode-capture #stepper{display:none}
body.mode-capture main{grid-column:2;grid-row:2}
body.mode-capture aside{grid-column:3;grid-row:2}
@media (max-width:1100px){body.mode-capture .app{grid-template-columns:0 1fr 420px}}
.wz h2{margin:6px 0 4px;font-size:21px}
.wzsteps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 16px}
.wzsteps li{flex:1}
.wzsteps button{width:100%;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-weight:600;font-size:12.5px;color:var(--muted)}
.wzsteps button span{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #3a4150;font-size:11px;flex:none}
.wzsteps button.on{color:var(--text);border-color:var(--accent);background:#ff7a1a10}
.wzsteps button.on span{background:var(--accent);border-color:var(--accent);color:#1a0d02}
.wzsteps button.done span{background:#3ecf8e1f;border-color:var(--ok);color:var(--ok)}
.wzsteps button:disabled{opacity:.45;cursor:default}
.wzeng{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#0e1015;margin:12px 0;font-size:13px;line-height:1.5}
.wzeng .capdot{margin-top:6px;flex:none}.wzeng.off{border-color:#ff5d5d55}.wzeng.demo{border-color:#ffc83d55}.wzeng a{color:var(--accent2)}
.wzdrop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed #3a4150;border-radius:16px;padding:34px 16px;cursor:pointer;text-align:center;background:#0e101566;transition:.15s}
.wzdrop:hover,body.dragging .wzdrop{border-color:var(--accent);background:#ff7a1a0d}
.wzdrop .big{font-size:40px;line-height:1;margin-bottom:6px}.wzdrop b{font-size:17px}.wzdrop span{color:var(--accent2)}.wzdrop small{color:var(--muted);margin-top:4px}
.wzfile{border:1px solid var(--line);border-radius:13px;background:#0e1015;padding:10px;display:flex;flex-direction:column;gap:6px}
.wzfile video{width:100%;max-height:220px;border-radius:9px;background:#000}
.wzfile .row{display:flex;justify-content:space-between;align-items:center}
.wzfile .link{color:var(--accent2);cursor:pointer;text-decoration:underline}
.wzq{font-weight:700;margin:16px 0 0}
.wznote{border:1px solid #5aa9ff55;background:#5aa9ff10;border-radius:11px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.5}
.wznote.warn{border-color:#ffc83d66;background:#ffc83d10;display:flex;flex-direction:column;gap:8px}.wznote a{color:var(--accent2)}
.wzmore{margin:12px 0;border:1px solid var(--line);border-radius:11px;padding:8px 12px;background:#0e101555}
.wzmore summary{cursor:pointer;font-weight:600;color:var(--muted)}
.wzmore .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.wzmore .field input,.wzmore .field select{width:100%;box-sizing:border-box;min-width:0}
.wzmore .field{margin-top:10px}
.wzprog{border:1px solid var(--line);border-radius:14px;background:#0e1015;padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
.wzprog .bar{width:100%;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.wzprog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.wzprog small{color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--panel2);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.wzchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.wzcard{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:5px;cursor:pointer;color:var(--text);font:inherit}
.wzcard b{font-size:14.5px}.wzcard small{color:var(--muted);line-height:1.45}
.wzcard.sel{border-color:var(--accent);background:#ff7a1a10;box-shadow:0 0 0 3px #ff7a1a1a}
.wztiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.wztile{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-weight:700;color:var(--text)}
.wztile .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#0e1015;border:1px solid var(--line);font-size:12px;color:var(--accent2)}
.wztile.sel{border-color:var(--accent);background:#ff7a1a10;box-shadow:0 0 0 3px #ff7a1a1a}
.wzdone ol{margin:8px 0 6px;padding-left:20px;line-height:1.7}
.wzdone details summary{cursor:pointer;font-weight:600;color:var(--accent2)}
.nav.split{justify-content:space-between}
.wz .clips .cname{flex:1}
  .ver{font-size:11px;color:inherit;opacity:.6;text-decoration:none;margin-left:4px}.ver:hover{opacity:1;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="mark">J</div>JustRigIt <a id="ver" class="ver" href="https://github.com/SuddleMercury/justrigit" target="_blank" rel="noopener" title="Free software (AGPL-3.0) by SuddleMercury: source code and updates on GitHub"></a></div>
    <div class="modes" role="tablist">
      <button data-mode="capture" role="tab" title="Turn a video into an animation">🎥 Video to animation</button>
      <button data-mode="advanced" role="tab" title="Rig characters, add library animations, fix import problems">🦴 Rig &amp; animate <small>advanced</small></button>
    </div>
    <div class="sp"></div>
    <button class="hbtn" data-action="open-glossary">📖 <span class="label">Glossary</span></button>
    <button class="hbtn ai" data-action="open-ai">🤖 <span class="label">AI access</span></button>
  </header>
  <nav id="stepper"></nav>
  <main>
    <div id="viewport"></div>
    <div id="markers" hidden></div>
    <div id="hud"></div>
    <div class="vtools">
      <button data-action="toggle-skel" title="Show the bones">Bones</button>
      <button data-action="reset-cam" title="Re-frame the character">Frame</button>
    </div>
    <div class="legend"><i></i>Forward (+Z) · drag to orbit · scroll to zoom</div>
    <div id="timeline" hidden>
      <button id="btn-pause" data-action="pause" title="Play / pause (Space)">❚❚</button>
      <span id="tl-name"></span>
      <input id="tl-bar" type="range" min="0" max="1000" value="0" aria-label="Scrub animation">
      <span id="tl-time">0.00s</span>
    </div>
  </main>
  <aside>
    <div id="panel"></div>
    <div id="log">
      <button class="lh" data-action="toggle-log">▴ Activity <span class="c" id="log-count">0</span></button>
      <ul id="log-list"></ul>
    </div>
  </aside>
</div>
<div id="modal" hidden><div class="mbox"><button class="x" data-action="close-modal" aria-label="Close">×</button><div id="modal-body"></div></div></div>
<div id="toasts"></div>
<div id="busy" hidden>Loading…</div>
<script>/*__APP__*/</script>
</body>
</html>
